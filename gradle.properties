# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache.
org.gradle.configuration-cache=false

# Fabric Properties
# Minecraft 1.21.11 is obfuscated, so this project uses the remapping Loom plugin.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.4
loader_version=0.18.4
loom_version=1.17-SNAPSHOT

# Mover Fabric Properties
mod_version=0.1.0-SNAPSHOT
maven_group=pumpkin2enchantMC.net
archives_base_name=Mover

# Dependencies
fabric_version=0.141.4+1.21.11
